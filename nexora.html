function help(){return `<h2 style="margin-top:0">Support Center</h2>${[["How do I get my key?","Keys appear instantly in your library after payment."],["Can I get a refund?","Yes, unredeemed keys can be refunded within 14 days."],["How do I become a seller?","Open Sell Games and create a seller profile."]].map(x=>`<div class="pn" style="margin-bottom:8px"><b>${x[0]}</b><p class="mu">${x[1]}</p></div>`).join("")}`}
const R={home,browse,deals:()=>sec("Deals &amp; Discounts",G.filter(g=>dc(g)>0).sort((a,b)=>dc(b)-dc(a))),categories:()=>home().split("Popular Categories")[1]?`<h2 style="margin-top:0">Browse Categories</h2><div class="row">${[...new Set(G.map(g=>g.g))].map(c=>`<a class="pn" href="#browse" onclick="F.genre='${c}'"><b>${c}</b></a>`).join("")}</div>`:"",cart,checkout,confirm:confirm_,account:acct,seller,admin,login:()=>auth(0),register:()=>auth(1),wishlist:wl,help};
function route(){clearInterval(ht);$("#np").hidden=true;const h=location.hash.slice(1)||"home";let html;try{html=h.startsWith("game-")?game(+h.slice(5)):(R[h]||(()=>`<div class="pn">Page not found. <a href="#home" class="ok">Go home</a></div>`))()}catch(e){html=`<div class="pn bad">Something went wrong.</div>`}
 $("#app").innerHTML=html||"";const ap=$("#app");ap.classList.remove("pg");void ap.offsetWidth;ap.classList.add("pg");if(h=="browse")grid();rv();if(h=="home")initFx();hd();if(h=="categories"||h=="home")scrollTo(0,0);$$("#lk a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")=="#"+h))}
$("#lk").innerHTML=[["home","Home"],["browse","Discover Games"],["categories","Categories"],["deals","Deals"],["seller","Sell Games"],["wishlist","Wishlist"],["help","Support"]].map(x=>`<a href="#${x[0]}">${x[1]}</a>`).join("");
$("#q").addEventListener("input",e=>{const v=e.target.value.toLowerCase(),a=$("#ac"),l=v?G.filter(g=>(g.t+g.d).toLowerCase().includes(v)).slice(0,5):[];a.hidden=!l.length;a.innerHTML=l.map(g=>`<a href="#game-${g.id}" onclick="$('#ac').hidden=1">${g.t} <small class="mu">${g.d}</small></a>`).join("")});
$("#q").addEventListener("keydown",e=>{if(e.key=="Enter"){F.q=e.target.value;$("#ac").hidden=1;location.hash="browse";route()}});
addEventListener("hashchange",route);badges();route();
</script></body></html>
